name: ESP-IDF build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BETA_TAG: v0.1.0-beta.2
  MERGED_BIN: One-OS-v0.1.0-beta.2-merged.bin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ESP32-C6 firmware and merged image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32c6
          path: firmware
          command: >-
            idf.py build &&
            idf.py merge-bin -o One-OS-v0.1.0-beta.2-merged.bin -f raw &&
            sha256sum build/One-OS-v0.1.0-beta.2-merged.bin > build/One-OS-v0.1.0-beta.2-merged.bin.sha256

      - name: Upload merged firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: one-os-v0.1.0-beta.2
          if-no-files-found: error
          path: |
            firmware/build/One-OS-v0.1.0-beta.2-merged.bin
            firmware/build/One-OS-v0.1.0-beta.2-merged.bin.sha256

  beta-release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[beta2-release]')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download merged firmware
        uses: actions/download-artifact@v4
        with:
          name: one-os-v0.1.0-beta.2
          path: dist

      - name: Create beta.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$BETA_TAG" \
            "dist/$MERGED_BIN#Merged ESP32-C6 flash image" \
            "dist/$MERGED_BIN.sha256#SHA-256 checksum" \
            --target "$GITHUB_SHA" \
            --title "One-OS v0.1.0-beta.2" \
            --prerelease \
            --notes $'Hardware smoke-test beta.2 for Waveshare ESP32-C6-Touch-LCD-1.9.\n\nReworked 170x320 touch UI with a fixed green header and vertically scrollable two-line test cards so labels and results no longer overlap.\n\nTests: Wi-Fi active scan, BLE passive discovery, IEEE 802.15.4 channel sweep, SD write/read verification, and confirmed FAT formatting.\n\nThe merged image contains bootloader + partition table + application and should be flashed at offset 0x0.'
