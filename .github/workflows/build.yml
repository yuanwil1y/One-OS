name: ESP-IDF build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all host test groups
        # tests/run_all_host_tests.sh is the single entry point. It invokes the
        # original per-group runners, so this job and a developer shell run the
        # identical commands. LEAK_SANITIZER=0 only disables the LeakSanitizer
        # leak check; ASan/UBSan stay active.
        run: LEAK_SANITIZER=0 tests/run_all_host_tests.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-C6 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32c6
          path: firmware
          command: idf.py build
